# Reverse proxy for the BurgirrHub microservices stack.
# All external traffic enters here and is forwarded to the API Gateway,
# which is the only service meant to be reachable from outside the
# Docker network in a real deployment.
#
# Production HTTPS: once a domain's A record points at the host's public
# IP, install certbot on the host (not in this container) and run:
#   sudo certbot --nginx -d yourdomain.com
# Certbot will rewrite this file with a TLS server block and handle
# renewal automatically. See DEPLOYMENT.md for the full EC2 walkthrough.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
