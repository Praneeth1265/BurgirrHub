# Reverse proxy for the BurgirrHub microservices stack.
# All external traffic enters here and is forwarded to the API Gateway,
# which is the only service meant to be reachable from outside the
# Docker network in a real deployment.
#
# HTTPS setup (see DEPLOYMENT.md "HTTPS with sslip.io" section):
#   1. Replace YOUR_DOMAIN below with your real hostname
#      (e.g. 203-0-113-45.sslip.io) in BOTH server blocks.
#   2. `docker compose stop nginx`, run certbot --standalone to obtain
#      the cert (writes to /etc/letsencrypt on the host, already bind
#      -mounted into this container read-only), then `docker compose up
#      -d nginx` to pick up this config.

server {
    listen 80;
    server_name _;

    # Lets Certbot's HTTP-01 challenge through even after HTTPS is live,
    # so renewals can use the webroot method without downtime.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
